name: Publish separately approved signed driver Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact reviewed protected driver tag
        required: true
        type: string
      reviewed_commit:
        description: Exact reviewed public driver commit
        required: true
        type: string
      build_run_id:
        description: Successful build-release run containing signed candidate and smoke report
        required: true
        type: string
      approval_json_b64:
        description: Base64 of separately approved exact ten-asset identity JSON
        required: true
        type: string
      approval_json_sha256:
        description: Separately approved byte SHA-256 of that JSON
        required: true
        type: string
      smoke_report_sha256:
        description: Separately reviewed no-tape smoke report SHA-256
        required: true
        type: string

permissions:
  contents: read

# Release Environments require human review and block administrator bypass.
# The approved single-owner policy permits self-review; agents must never
# approve for the human reviewer. Publication approval must acknowledge GitHub's residual,
# non-atomic administrator-setting race. This workflow never receives a
# signing secret. Public source/tag and final Release require separate owner
# approval; installing this workflow is not permission to dispatch it.
jobs:
  preflight:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: public-driver-rpm-admin-read
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject a moving branch before loading the admin credential
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$REVIEWED_COMMIT"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$REVIEWED_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Require authenticated immutable releases before creating a draft
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_DRIVER_ADMIN_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api -i "repos/$GITHUB_REPOSITORY/immutable-releases" > "$RUNNER_TEMP/immutable.http"
          python3 scripts/verify-public-release.py --verify-immutability-http "$RUNNER_TEMP/immutable.http"

  publish:
    needs: preflight
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: public-driver-rpm-publication
    permissions:
      contents: write
      actions: read
    outputs:
      draft_id: ${{ steps.draft.outputs.draft_id }}
      asset_set_sha256: ${{ steps.draft.outputs.asset_set_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      APPROVAL_JSON_B64: ${{ inputs.approval_json_b64 }}
      APPROVAL_JSON_SHA256: ${{ inputs.approval_json_sha256 }}
      SMOKE_REPORT_SHA256: ${{ inputs.smoke_report_sha256 }}
      ENV_APPROVED_TAG: ${{ vars.PUBLIC_DRIVER_APPROVED_TAG }}
      ENV_APPROVED_COMMIT: ${{ vars.PUBLIC_DRIVER_APPROVED_COMMIT }}
      ENV_APPROVED_BUILD_RUN_ID: ${{ vars.PUBLIC_DRIVER_APPROVED_BUILD_RUN_ID }}
      ENV_APPROVED_JSON_SHA256: ${{ vars.PUBLIC_DRIVER_APPROVED_JSON_SHA256 }}
      ENV_APPROVED_SMOKE_SHA256: ${{ vars.PUBLIC_DRIVER_APPROVED_SMOKE_SHA256 }}
      ENV_RESIDUAL_ADMIN_RACE_ACK: ${{ vars.PUBLIC_DRIVER_RESIDUAL_ADMIN_RACE_ACK }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Admit protected tag, reviewed build and exact separate approval
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$APPROVAL_JSON_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SMOKE_REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$REVIEWED_COMMIT"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$REVIEWED_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$ENV_APPROVED_TAG" = "$RELEASE_TAG"
          test "$ENV_APPROVED_COMMIT" = "$REVIEWED_COMMIT"
          test "$ENV_APPROVED_BUILD_RUN_ID" = "$BUILD_RUN_ID"
          test "$ENV_APPROVED_JSON_SHA256" = "$APPROVAL_JSON_SHA256"
          test "$ENV_APPROVED_SMOKE_SHA256" = "$SMOKE_REPORT_SHA256"
          test "$ENV_RESIDUAL_ADMIN_RACE_ACK" = acknowledged-non-atomic-admin-race
          printf '%s' "$APPROVAL_JSON_B64" | base64 --decode > "$RUNNER_TEMP/approval.json"
          test "$(sha256sum "$RUNNER_TEMP/approval.json" | cut -d' ' -f1)" = "$APPROVAL_JSON_SHA256"
          python3 - "$RUNNER_TEMP/approval.json" <<'PY'
          import os, runpy, sys
          from pathlib import Path
          gate = runpy.run_path("scripts/verify-public-release.py")
          approval = gate["parse_approval_document"](Path(sys.argv[1]).read_bytes())
          if any(approval[key] != os.environ[expected] for key, expected in (
              ("repo", "GITHUB_REPOSITORY"), ("tag", "RELEASE_TAG"),
              ("commit", "REVIEWED_COMMIT"),
          )):
              raise SystemExit("driver approval differs from protected source identity")
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/build-run.json"
          python3 - "$RUNNER_TEMP/build-run.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          run = json.loads(Path(sys.argv[1]).read_text())
          if not (
              run.get("repository", {}).get("full_name") == os.environ["GITHUB_REPOSITORY"]
              and run.get("head_repository", {}).get("full_name") == os.environ["GITHUB_REPOSITORY"]
              and run.get("head_sha") == os.environ["REVIEWED_COMMIT"]
              and run.get("head_branch") == os.environ["RELEASE_TAG"]
              and run.get("path") == ".github/workflows/build-release.yml"
              and run.get("event") == "workflow_dispatch"
              and run.get("status") == "completed" and run.get("conclusion") == "success"
          ):
              raise SystemExit("reviewed driver build run differs or failed")
          PY
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'release already exists; never replace its assets' >&2
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-driver-release-candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: driver-no-tape-smoke-report
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/smoke
      - name: Verify smoke result, exact signed candidate and source provenance
        run: |
          set -euo pipefail
          test "$(sha256sum "$RUNNER_TEMP/smoke/driver-smoke-report.json" | cut -d' ' -f1)" = "$SMOKE_REPORT_SHA256"
          python3 - "$RUNNER_TEMP/smoke/driver-smoke-report.json" <<'PY'
          import json, os, runpy, sys
          from pathlib import Path
          gate = runpy.run_path("scripts/verify-public-release.py")
          gate["verify_smoke_report"](
              json.loads(Path(sys.argv[1]).read_text()), os.environ["GITHUB_REPOSITORY"],
              os.environ["REVIEWED_COMMIT"], int(os.environ["BUILD_RUN_ID"]),
          )
          PY
          sudo apt-get update
          sudo apt-get install -y cpio gnupg rpm rpm2cpio
          python3 scripts/verify-public-release.py \
            --candidate "$RUNNER_TEMP/candidate" --approved-json "$RUNNER_TEMP/approval.json" \
            --source-root "$PWD" --report "$RUNNER_TEMP/verified.json"
      - name: Create only the exact reviewed draft and re-download it
        id: draft
        run: |
          set -euo pipefail
          approval="$RUNNER_TEMP/approval.json"
          candidate="$RUNNER_TEMP/candidate"
          {
            printf 'LTO LTFS driver %s\n\n' "$RELEASE_TAG"
            printf 'Reviewed source: %s @ %s (%s)\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$REVIEWED_COMMIT"
            printf 'Successful GitHub build run: %s\n' "$BUILD_RUN_ID"
            printf 'Approved no-tape smoke report SHA-256: %s\n' "$SMOKE_REPORT_SHA256"
            printf 'Exact approved driver assets are recorded in the signed manifest and separate approval.\n'
            printf 'Seven downstream origins remain conditional and unverified; LGPL-2.1-only is the owner-selected policy, not provenance proof.\n'
            printf 'This does not qualify a physical tape device or provide a DNF repository.\n'
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" --draft --verify-tag \
            --title "LTO LTFS driver $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "$candidate"/*
          gh release view "$RELEASE_TAG" --json databaseId,isDraft > "$RUNNER_TEMP/draft-view.json"
          draft_id="$(python3 - "$RUNNER_TEMP/draft-view.json" <<'PY'
          import json, sys
          from pathlib import Path
          state = json.loads(Path(sys.argv[1]).read_text())
          if type(state.get("databaseId")) is not int or state["databaseId"] <= 0 or state.get("isDraft") is not True:
              raise SystemExit("driver draft identity missing")
          print(state["databaseId"])
          PY
          )"
          mkdir "$RUNNER_TEMP/draft-assets"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/draft-assets" --pattern '*'
          gh api "repos/$GITHUB_REPOSITORY/releases/$draft_id" > "$RUNNER_TEMP/draft.json"
          asset_set="$(python3 - "$RUNNER_TEMP/draft.json" "$RUNNER_TEMP/draft-assets" "$approval" "$draft_id" <<'PY'
          import json, os, runpy, sys
          from pathlib import Path
          gate = runpy.run_path("scripts/verify-public-release.py")
          approved = gate["parse_approval_document"](Path(sys.argv[3]).read_bytes())["assets"]
          gate["verify_draft_identity"](
              json.loads(Path(sys.argv[1]).read_text()), Path(sys.argv[2]),
              approved, int(sys.argv[4]), os.environ["RELEASE_TAG"],
          )
          print(gate["asset_set_sha256"](approved))
          PY
          )"
          printf 'draft_id=%s\nasset_set_sha256=%s\n' "$draft_id" "$asset_set" >> "$GITHUB_OUTPUT"

  final_preflight:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: public-driver-rpm-admin-read
    permissions:
      contents: read
      actions: read
    outputs:
      proof: ${{ steps.proof.outputs.proof }}
    env:
      GH_TOKEN: ${{ github.token }}
      DRAFT_ID: ${{ needs.publish.outputs.draft_id }}
      PUBLISH_ASSET_SET_SHA256: ${{ needs.publish.outputs.asset_set_sha256 }}
      RELEASE_TAG: ${{ inputs.tag }}
      REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      APPROVAL_JSON_B64: ${{ inputs.approval_json_b64 }}
      APPROVAL_JSON_SHA256: ${{ inputs.approval_json_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-driver-release-candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - name: Recheck the exact signed candidate and numeric draft before final admin read
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$REVIEWED_COMMIT"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$REVIEWED_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          [[ "$DRAFT_ID" =~ ^[1-9][0-9]*$ ]]
          printf '%s' "$APPROVAL_JSON_B64" | base64 --decode > "$RUNNER_TEMP/approval.json"
          test "$(sha256sum "$RUNNER_TEMP/approval.json" | cut -d' ' -f1)" = "$APPROVAL_JSON_SHA256"
          sudo apt-get update
          sudo apt-get install -y cpio gnupg rpm rpm2cpio
          python3 scripts/verify-public-release.py \
            --candidate "$RUNNER_TEMP/candidate" --approved-json "$RUNNER_TEMP/approval.json" \
            --source-root "$PWD" --report "$RUNNER_TEMP/verified.json"
          mkdir "$RUNNER_TEMP/draft-assets"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/draft-assets" --pattern '*'
          gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" > "$RUNNER_TEMP/draft.json"
          python3 - "$RUNNER_TEMP/draft.json" "$RUNNER_TEMP/draft-assets" "$RUNNER_TEMP/approval.json" <<'PY'
          import json, os, runpy, sys
          from pathlib import Path
          gate = runpy.run_path("scripts/verify-public-release.py")
          approved = gate["parse_approval_document"](Path(sys.argv[3]).read_bytes())["assets"]
          gate["verify_draft_identity"](
              json.loads(Path(sys.argv[1]).read_text()), Path(sys.argv[2]),
              approved, int(os.environ["DRAFT_ID"]), os.environ["RELEASE_TAG"],
          )
          if gate["asset_set_sha256"](approved) != os.environ["PUBLISH_ASSET_SET_SHA256"]:
              raise SystemExit("driver draft assets differ from publication proof")
          PY
      - name: Last authenticated immutable-release check and exact draft proof
        id: proof
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_DRIVER_ADMIN_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api -i "repos/$GITHUB_REPOSITORY/immutable-releases" > "$RUNNER_TEMP/immutable.http"
          python3 scripts/verify-public-release.py --verify-immutability-http "$RUNNER_TEMP/immutable.http"
          proof="$(python3 - "$RUNNER_TEMP/approval.json" <<'PY'
          import os, runpy, sys, time, json
          from pathlib import Path
          gate = runpy.run_path("scripts/verify-public-release.py")
          approved = gate["parse_approval_document"](Path(sys.argv[1]).read_bytes())["assets"]
          value = gate["make_final_proof"](
              os.environ["GITHUB_REPOSITORY"], os.environ["RELEASE_TAG"],
              os.environ["REVIEWED_COMMIT"], int(os.environ["DRAFT_ID"]),
              approved["FINAL-RPM-SHA256SUMS"], gate["asset_set_sha256"](approved),
              int(os.environ["GITHUB_RUN_ID"]), int(time.time()),
          )
          if value["asset_set_sha256"] != os.environ["PUBLISH_ASSET_SET_SHA256"]:
              raise SystemExit("driver proof differs from verified draft")
          print(json.dumps(value, sort_keys=True, separators=(",", ":")))
          PY
          )"
          printf 'proof=%s\n' "$proof" >> "$GITHUB_OUTPUT"

  finalize:
    needs: final_preflight
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      FINAL_PROOF: ${{ needs.final_preflight.outputs.proof }}
      RELEASE_TAG: ${{ inputs.tag }}
      REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      APPROVAL_JSON_B64: ${{ inputs.approval_json_b64 }}
      APPROVAL_JSON_SHA256: ${{ inputs.approval_json_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-driver-release-candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - name: Verify unchanged signed draft and fresh proof before draft=false
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$REVIEWED_COMMIT"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$REVIEWED_COMMIT"
          printf '%s' "$APPROVAL_JSON_B64" | base64 --decode > "$RUNNER_TEMP/approval.json"
          test "$(sha256sum "$RUNNER_TEMP/approval.json" | cut -d' ' -f1)" = "$APPROVAL_JSON_SHA256"
          sudo apt-get update
          sudo apt-get install -y cpio gnupg rpm rpm2cpio
          python3 scripts/verify-public-release.py \
            --candidate "$RUNNER_TEMP/candidate" --approved-json "$RUNNER_TEMP/approval.json" \
            --source-root "$PWD" --report "$RUNNER_TEMP/verified.json"
          draft_id="$(python3 - <<'PY'
          import json, os
          value = json.loads(os.environ["FINAL_PROOF"])
          if type(value) is not dict or type(value.get("draft_id")) is not int or value["draft_id"] <= 0:
              raise SystemExit("driver final proof lacks numeric draft ID")
          print(value["draft_id"])
          PY
          )"
          gh api "repos/$GITHUB_REPOSITORY/releases/$draft_id" > "$RUNNER_TEMP/draft.json"
          mkdir "$RUNNER_TEMP/draft-assets"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/draft-assets" --pattern '*'
          python3 - "$RUNNER_TEMP/draft.json" "$RUNNER_TEMP/draft-assets" "$RUNNER_TEMP/approval.json" <<'PY'
          import json, os, runpy, sys, time
          from pathlib import Path
          gate = runpy.run_path("scripts/verify-public-release.py")
          approved = gate["parse_approval_document"](Path(sys.argv[3]).read_bytes())["assets"]
          release = json.loads(Path(sys.argv[1]).read_text())
          proof = json.loads(os.environ["FINAL_PROOF"])
          gate["verify_draft_identity"](
              release, Path(sys.argv[2]), approved, proof["draft_id"], os.environ["RELEASE_TAG"],
          )
          expected = {
              "repo": os.environ["GITHUB_REPOSITORY"], "tag": os.environ["RELEASE_TAG"],
              "commit": os.environ["REVIEWED_COMMIT"], "draft_id": release["id"],
              "manifest_sha256": approved["FINAL-RPM-SHA256SUMS"],
              "asset_set_sha256": gate["asset_set_sha256"](approved),
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
          }
          gate["validate_final_proof"](proof, expected, int(time.time()))
          PY
          gh release edit "$RELEASE_TAG" --draft=false --verify-tag
          gh api "repos/$GITHUB_REPOSITORY/releases/$draft_id" > "$RUNNER_TEMP/published.json"
          mkdir "$RUNNER_TEMP/published-assets"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/published-assets" --pattern '*'
          python3 - "$RUNNER_TEMP/published.json" "$RUNNER_TEMP/published-assets" "$RUNNER_TEMP/approval.json" "$draft_id" <<'PY'
          import json, os, runpy, sys
          from pathlib import Path
          gate = runpy.run_path("scripts/verify-public-release.py")
          approved = gate["parse_approval_document"](Path(sys.argv[3]).read_bytes())["assets"]
          gate["verify_draft_identity"](
              json.loads(Path(sys.argv[1]).read_text()), Path(sys.argv[2]),
              approved, int(sys.argv[4]), os.environ["RELEASE_TAG"], expect_draft=False,
          )
          PY
          python3 scripts/verify-public-release.py \
            --candidate "$RUNNER_TEMP/published-assets" --approved-json "$RUNNER_TEMP/approval.json" \
            --source-root "$PWD" --report "$RUNNER_TEMP/published-verification.json"
          test "$(gh release view "$RELEASE_TAG" --json isDraft,isImmutable \
            --jq '.isDraft == false and .isImmutable == true')" = true
